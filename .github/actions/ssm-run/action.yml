name: ssm-run
description: Send one SSM document to the alert host, wait for it, and surface its output as this step's result.

# Both workflows need the same thing: send a command, wait, print what the
# host said, and fail the run if the host failed. Doing that in one place
# means the observe path and the deploy path cannot drift apart in how they
# report a failure — which matters, because "the deploy said nothing" and
# "the deploy succeeded" must never look the same.

inputs:
  document:
    description: SSM document name.
    required: true
  instance-id:
    description: Target EC2 instance.
    required: true
  parameters:
    description: Comma-separated key=value pairs for the document.
    required: true
  timeout-seconds:
    description: How long the host may take.
    required: true
  finding-exit-codes:
    description: >-
      Space-separated host exit codes that mean "the command worked and found
      something", not "the command failed". These annotate the run and let it
      pass. Anything else non-zero fails it. Empty means every non-zero exit is
      a failure, which is the right default for a write path.
    required: false
    default: ''

outputs:
  finding:
    description: >-
      'true' when the host exited with one of finding-exit-codes — the command
      worked and found something. Empty otherwise.
    value: ${{ steps.send.outputs.finding }}

runs:
  using: composite
  steps:
    - name: Check the host is reachable before sending anything
      shell: bash
      run: |
        set -euo pipefail
        ping_state=$(aws ssm describe-instance-information \
          --filters "Key=InstanceIds,Values=${{ inputs.instance-id }}" \
          --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "None")
        if [[ "$ping_state" != "Online" ]]; then
          echo "::error::SSM agent on ${{ inputs.instance-id }} is '$ping_state', not Online."
          echo "The host is unreachable, which is a different problem from a failed deploy."
          echo "Check the instance is running and has the alert-platform-instance profile attached."
          exit 1
        fi
        echo "SSM agent is Online."

    - name: Send and wait
      id: send
      shell: bash
      run: |
        set -euo pipefail

        command_id=$(aws ssm send-command \
          --document-name '${{ inputs.document }}' \
          --instance-ids '${{ inputs.instance-id }}' \
          --parameters '${{ inputs.parameters }}' \
          --timeout-seconds '${{ inputs.timeout-seconds }}' \
          --comment 'gha:${{ github.run_id }}' \
          --query 'Command.CommandId' --output text)
        echo "command-id: $command_id"

        # Poll rather than `aws ssm wait`: the waiter gives up after its own
        # fixed number of attempts, which is shorter than an apply.
        deadline=$(( $(date +%s) + ${{ inputs.timeout-seconds }} + 60 ))
        status=Pending
        while [[ $(date +%s) -lt $deadline ]]; do
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id '${{ inputs.instance-id }}' \
            --query 'Status' --output text 2>/dev/null || echo Pending)
          case "$status" in
            Success|Failed|Cancelled|TimedOut) break ;;
          esac
          sleep 10
        done

        # Output first, verdict second: if this step fails, whoever reads the
        # log wants what the host said, not just that it went wrong.
        invocation=$(aws ssm get-command-invocation \
          --command-id "$command_id" --instance-id '${{ inputs.instance-id }}' \
          --output json)

        echo "----- host stdout -----"
        echo "$invocation" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StandardOutputContent",""))'
        stderr=$(echo "$invocation" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StandardErrorContent",""))')
        if [[ -n "${stderr// }" ]]; then
          echo "----- host stderr -----"
          echo "$stderr"
        fi
        # SSM has no idea what the command meant; it only knows the exit
        # code, and it calls every non-zero one Failed. verdict.sh is where
        # that is turned back into a verdict, in its own file so CI can test
        # it and so the finding set is passed as an argument rather than
        # spliced into this shell.
        code=$(echo "$invocation" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ResponseCode", ""))')

        echo "-----------------------"
        echo "status: $status (host exit ${code:-unknown})"

        # Which alertctl answered, and whether it is this commit. Before the
        # verdict, because a stale control plane changes how the output above
        # should be read, and a failed run needs that context most.
        echo "$invocation" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin).get("StandardOutputContent",""))' \
          | "$GITHUB_ACTION_PATH/stamp.sh" "${{ github.sha }}"

        "$GITHUB_ACTION_PATH/verdict.sh" \
          "$status" "$code" "${{ inputs.finding-exit-codes }}" \
          '${{ inputs.document }}' '${{ inputs.instance-id }}'
