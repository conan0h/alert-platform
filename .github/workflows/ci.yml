name: ci

# The deploy gate and CI run the same checks through the same entry points.
# A green build here means `alertctl apply` will not fail its validation gate.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  fleet:
    name: fleet spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml jsonschema ruff
      - name: Lint (ruff)
        run: ruff check services tools
      - name: Validate specs and fleet invariants
        run: python3 tools/validate.py
      - name: Observability config is up to date with the specs
        run: python3 tools/gen_observability.py --check

  control-plane:
    name: alertctl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go vet -mod=vendor ./...
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout 3m
      - name: Formatting is canonical
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go test -mod=vendor ./... -race
      - run: go build -mod=vendor -o bin/alertctl ./cmd/alertctl
      - uses: actions/upload-artifact@v4
        with:
          name: alertctl
          path: bin/alertctl

  services:
    name: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: pip install pytest pyyaml -r services/requirements.txt
      # Built here so the cross-language contract tests run rather than skip:
      # they are the only check that the Go-rendered environment satisfies
      # the Python config loader.
      - run: go build -mod=vendor -o bin/alertctl ./cmd/alertctl
      - run: python3 -m pytest services/tests -q

  ops:
    name: deploy path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Go, because the wrapper's job is to build alertctl and the test suite
      # now compiles it the way the wrapper does — from a cwd outside the
      # checkout, which is the case that was broken while 53 dry-run tests
      # passed.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      # The wrapper is the entire blast radius of the deploy pipeline: IAM
      # says which host and which documents, and everything past that is
      # decided by this one script. A shell bug here is a production incident,
      # so it is linted and its argument validation is tested.
      - name: Lint (shellcheck)
        run: |
          shellcheck deploy/ops/alert-deploy deploy/ops/alert-deploy_test.sh deploy/ops/bootstrap-host.sh
          shellcheck .github/actions/ssm-run/verdict.sh .github/actions/ssm-run/verdict_test.sh
      - name: The wrapper refuses what it should refuse
        run: ./deploy/ops/alert-deploy_test.sh
      # The other half of the boundary: which host exit codes fail a run. SSM
      # reports "drift found" and "host unreachable" identically, so this is
      # the only place the difference is decided.
      - name: A finding is not a failure
        run: ./.github/actions/ssm-run/verdict_test.sh

  infra:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Formatting is canonical
        run: terraform fmt -check -recursive -diff infra/
      # -backend=false: this validates the configuration, it does not touch
      # any state and cannot reach the account. Applying is a human act done
      # from CloudShell — never from CI, and never by the agent.
      # -backend=false: this validates the configuration, it does not touch any
      # state and cannot reach the account. It also means the S3 backend block in
      # infra/terraform does not need the bucket to exist or any credential.
      - name: Configuration is valid
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate

  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential-shaped values and runtime state
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.db$|\.log$|\.pem$'; then
            echo "::error::runtime state or secrets are tracked in git"
            exit 1
          fi
          if git grep -nIE '[0-9]{6,}:[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN' \
               -- . ':(exclude)tools/validate.py' ':(exclude).github/workflows/ci.yml'; then
            echo "::error::credential-shaped value found in tracked files"
            exit 1
          fi
