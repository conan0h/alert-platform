name: observe

# Read-only. This workflow holds a permission that cannot change the host:
# the SSM document it is allowed to send accepts only the read verbs, so a
# mistake here is a bad report, never a bad deploy.
#
# It runs hourly as well as on demand, so there is a record of the fleet
# between agent runs rather than only during them. That record is what makes
# "it broke at some point last night" answerable.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verb:
        description: What to ask the host
        required: true
        default: status
        type: choice
        options: [status, drift, history, health, logs]

permissions:
  id-token: write   # mint the OIDC token; this is what replaces stored keys
  contents: read

concurrency:
  group: observe
  cancel-in-progress: false

jobs:
  observe:
    name: ${{ inputs.verb || 'status' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This workflow is on an hourly schedule, and the AWS side of the
      # pipeline is applied by hand (see the Handoff issue). Between those two
      # facts there is a window where every run would fail on a missing role
      # ARN — an hourly red X that teaches everyone to ignore red Xs. So the
      # window is reported once, as a notice, and the job stops cleanly.
      - name: Is the pipeline configured yet?
        id: configured
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]] || missing+=(AWS_DEPLOY_ROLE_ARN)
          [[ -n "${{ vars.AWS_REGION }}" ]]          || missing+=(AWS_REGION)
          [[ -n "${{ vars.ALERT_INSTANCE_ID }}" ]]   || missing+=(ALERT_INSTANCE_ID)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::notice::Deploy pipeline not configured yet — missing repository variables: ${missing[*]}. Nothing observed. See the Handoff issue."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assume the deploy role via OIDC
        if: steps.configured.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: observe-${{ github.run_id }}

      - name: Run the read-only verb on the host
        if: steps.configured.outputs.ready == 'true'
        uses: ./.github/actions/ssm-run
        with:
          document: AlertPlatform-Observe
          instance-id: ${{ vars.ALERT_INSTANCE_ID }}
          parameters: verb=${{ inputs.verb || 'status' }},actor=gha:${{ github.run_id }}
          timeout-seconds: '300'
          # 3 is alertctl's "I found what I look for" — drift found drift. It
          # annotates the run instead of failing it, because an hourly job that
          # is red for as long as the fleet is behind its specs is a job nobody
          # reads by the time it goes red for a real reason. An unreachable
          # host or a drift that could not run still fails, loudly, which is
          # the whole point of separating the two. See docs/adr/0002.
          finding-exit-codes: '3'
