# Lint policy for the control plane.
#
# Chosen rather than inherited: each linter below is here because it catches
# a class of bug that would matter in a deploy tool specifically.
#
#   errcheck    an ignored error in the apply path is a deploy that reports
#               success it did not achieve. The few deliberate discards are
#               written `_ =` and excluded below.
#   govet       shadowing and printf mistakes in operator-facing output
#   staticcheck the broad correctness set
#   ineffassign assignments that never take effect — the shape of the
#               `alerted_this_filing` bug already found on the Python side
#   unused      dead code in a control plane is code nobody has reviewed
#   bodyclose   the console makes HTTP calls; leaked bodies leak sockets
#   gosec       this process handles secrets and writes files as root
#   misspell    operator-facing strings are documentation

run:
  timeout: 3m
  modules-download-mode: vendor

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - gosec
    - misspell

linters-settings:
  errcheck:
    # Audit writes on the failure path are already `_ =` with a comment
    # explaining why: the deploy error is what the operator must see, and a
    # secondary audit error must not mask it.
    check-blank: false
  gosec:
    excludes:
      # G114: the console listener has no timeouts by design — it is a
      # loopback-only, read-only view and `serve` warns when bound wider.
      - G114

issues:
  exclude-rules:
    # Tests inject failures and read fixtures from known paths; the security
    # and error-check rules there produce noise, not findings.
    - path: _test\.go
      linters: [errcheck, gosec, bodyclose]
