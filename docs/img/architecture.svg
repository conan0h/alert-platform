<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="title desc">
  <title id="title">alert-platform: control plane and data plane</title>
  <desc id="desc">The Go control plane reads declarative specs, computes a plan, and reconciles
  four Python services on an EC2 host over SSH and systemd. The only thing crossing the boundary
  is a rendered environment contract.</desc>

  <style>
    .bg      { fill: #ffffff; }
    .plane   { fill: #f7f9fb; stroke: #c7d2de; stroke-width: 1.5; rx: 6; }
    .plane-l { fill: #5a6b7d; font-size: 11px; letter-spacing: .12em; }
    .box     { fill: #ffffff; stroke: #8a9bad; stroke-width: 1.2; rx: 4; }
    .box-a   { fill: #fff6e6; stroke: #e0a13c; stroke-width: 1.4; rx: 4; }
    .box-g   { fill: #eef4fa; stroke: #6f9bc7; stroke-width: 1.2; rx: 4; }
    .t       { fill: #16202b; font-size: 12px; }
    .t-b     { fill: #16202b; font-size: 12px; font-weight: 600; }
    .t-s     { fill: #5a6b7d; font-size: 10.5px; }
    .arrow   { stroke: #5a6b7d; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .arrow-a { stroke: #e0a13c; stroke-width: 1.8; fill: none; marker-end: url(#aa); }
    .dashed  { stroke-dasharray: 4 3; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a13c"/>
    </marker>
  </defs>

  <rect class="bg" width="900" height="560"/>

  <!-- control plane -->
  <rect class="plane" x="20" y="20" width="860" height="230"/>
  <text class="plane-l" x="36" y="41">CONTROL PLANE — Go, runs on the operator's machine</text>

  <rect class="box" x="40" y="58" width="160" height="52"/>
  <text class="t-b" x="52" y="78">fleet/fleet.yaml</text>
  <text class="t-s" x="52" y="94">defaults · targets · policy</text>

  <rect class="box" x="40" y="120" width="160" height="52"/>
  <text class="t-b" x="52" y="140">fleet/services/*.yaml</text>
  <text class="t-s" x="52" y="156">one spec per service</text>

  <rect class="box-g" x="40" y="182" width="160" height="46"/>
  <text class="t-b" x="52" y="201">tools/validate.py</text>
  <text class="t-s" x="52" y="216">gate 1 · shared with CI</text>

  <path class="arrow" d="M200,84 L246,84 L246,140 L262,140"/>
  <path class="arrow" d="M200,146 L262,146"/>

  <rect class="box" x="265" y="118" width="130" height="56"/>
  <text class="t-b" x="277" y="139">deep merge</text>
  <text class="t-s" x="277" y="154">scalars replace</text>
  <text class="t-s" x="277" y="167">lists never concat</text>

  <path class="arrow" d="M395,146 L425,146"/>

  <rect class="box" x="428" y="112" width="140" height="68"/>
  <text class="t-b" x="440" y="133">effective config</text>
  <text class="t-s" x="440" y="149">→ systemd unit</text>
  <text class="t-s" x="440" y="163">→ environment</text>
  <text class="t-s" x="440" y="176">→ scrape target</text>

  <path class="arrow dashed" d="M200,205 L232,205 L232,160 L262,160"/>

  <rect class="box-a" x="600" y="58" width="252" height="54"/>
  <text class="t-b" x="612" y="78">alertctl plan</text>
  <text class="t-s" x="612" y="94">observe → diff → fingerprinted plan.json</text>

  <rect class="box-a" x="600" y="120" width="252" height="60"/>
  <text class="t-b" x="612" y="140">alertctl apply</text>
  <text class="t-s" x="612" y="156">gates → one service at a time → verify</text>
  <text class="t-s" x="612" y="170">fail ⇒ automatic rollback</text>

  <rect class="box-g" x="600" y="188" width="252" height="46"/>
  <text class="t-b" x="612" y="207">alertctl serve</text>
  <text class="t-s" x="612" y="222">read-only console · same code paths</text>

  <path class="arrow" d="M568,140 L596,120"/>
  <path class="arrow" d="M568,152 L596,150"/>
  <path class="arrow dashed" d="M568,160 L596,205"/>

  <!-- boundary -->
  <path class="arrow-a" d="M726,234 L726,300"/>
  <rect x="612" y="248" width="228" height="38" fill="#fff6e6" stroke="#e0a13c" stroke-width="1.2" rx="4"/>
  <text class="t-b" x="624" y="264">ssh + systemd</text>
  <text class="t-s" x="624" y="278">the only boundary crossing</text>

  <!-- data plane -->
  <rect class="plane" x="20" y="300" width="860" height="238"/>
  <text class="plane-l" x="36" y="321">DATA PLANE — Python, runs on the EC2 host</text>

  <rect class="box-a" x="40" y="336" width="250" height="86"/>
  <text class="t-b" x="52" y="356">services/alertlib/</text>
  <text class="t-s" x="52" y="373">config from injected environment</text>
  <text class="t-s" x="52" y="387">JSON logging · SQLite state</text>
  <text class="t-s" x="52" y="401">rate-limited delivery</text>
  <text class="t-s" x="52" y="415">/healthz · /metrics</text>

  <rect x="316" y="328" width="278" height="104" fill="none" stroke="#c7d2de" stroke-width="1.2"
        stroke-dasharray="3 4" rx="5"/>
  <text class="t-s" x="326" y="343">four managed services</text>

  <g>
    <rect class="box" x="326" y="350" width="128" height="34"/>
    <text class="t" x="336" y="365">edgar-mna</text>
    <text class="t-s" x="336" y="378">SEC M&amp;A filings</text>

    <rect class="box" x="458" y="350" width="128" height="34"/>
    <text class="t" x="468" y="365">fda-catalysts</text>
    <text class="t-s" x="468" y="378">FDA decisions</text>

    <rect class="box" x="326" y="390" width="128" height="34"/>
    <text class="t" x="336" y="405">clinical-trials</text>
    <text class="t-s" x="336" y="418">trial updates</text>

    <rect class="box-a" x="458" y="390" width="128" height="34"/>
    <text class="t" x="468" y="405">form4-insider</text>
    <text class="t-s" x="468" y="418">critical tier</text>
  </g>

  <path class="arrow" d="M290,380 L312,380"/>
  <text class="t-s" x="236" y="434">every service imports it</text>

  <rect class="box-g" x="620" y="336" width="232" height="40"/>
  <text class="t-b" x="632" y="354">journald</text>
  <text class="t-s" x="632" y="368">JSON on stdout → shipper attaches here</text>

  <rect class="box-g" x="620" y="386" width="232" height="40"/>
  <text class="t-b" x="632" y="404">:91xx /metrics</text>
  <text class="t-s" x="632" y="418">Prometheus scrape → Grafana</text>

  <path class="arrow" d="M594,362 L616,356"/>
  <path class="arrow" d="M594,398 L616,406"/>

  <rect x="40" y="444" width="812" height="76" fill="#f2f5f8" stroke="#c7d2de" stroke-width="1.2" rx="4"/>
  <text class="t-b" x="54" y="465">The seam</text>
  <text class="t-s" x="54" y="483">The control plane holds no business logic; the services hold no deployment logic.</text>
  <text class="t-s" x="54" y="498">What crosses is one environment contract: rendered by internal/engine/unit.go, read by</text>
  <text class="t-s" x="54" y="513">alertlib/config.py, and checked from both sides by services/tests/test_contract.py.</text>
</svg>
