<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img"
     aria-labelledby="title desc">
  <title id="title">alert-platform deploy lifecycle</title>
  <desc id="desc">A deploy passes three pre-flight gates, deploys one service at a time,
  and must satisfy a post-deploy health gate. Any failure rolls the service back to its
  previous ref and stops the run. Every outcome is appended to the audit log.</desc>

  <style>
    .bg    { fill: #ffffff; }
    .lane  { stroke: #c7d2de; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .head  { fill: #eef2f7; stroke: #8a9bad; stroke-width: 1.2; rx: 4; }
    .t-h   { fill: #16202b; font-size: 11.5px; font-weight: 600; }
    .t     { fill: #16202b; font-size: 11.5px; }
    .t-s   { fill: #5a6b7d; font-size: 10.5px; }
    .gate  { fill: #eef4fa; stroke: #6f9bc7; stroke-width: 1.3; rx: 4; }
    .act   { fill: #ffffff; stroke: #8a9bad; stroke-width: 1.2; rx: 4; }
    .warn  { fill: #fdeceb; stroke: #cf5147; stroke-width: 1.4; rx: 4; }
    .good  { fill: #ecf7f1; stroke: #3f9b6d; stroke-width: 1.3; rx: 4; }
    .flow  { stroke: #5a6b7d; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .fail  { stroke: #cf5147; stroke-width: 1.5; fill: none; marker-end: url(#af); }
    .audit { stroke: #e0a13c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#aw); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf5147"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0a13c"/></marker>
  </defs>

  <rect class="bg" width="900" height="700"/>

  <!-- lane headers -->
  <rect class="head" x="30"  y="20" width="150" height="30"/>
  <text class="t-h" x="46"  y="40">operator</text>
  <rect class="head" x="215" y="20" width="230" height="30"/>
  <text class="t-h" x="231" y="40">alertctl (control plane)</text>
  <rect class="head" x="480" y="20" width="180" height="30"/>
  <text class="t-h" x="496" y="40">EC2 host</text>
  <rect class="head" x="695" y="20" width="175" height="30"/>
  <text class="t-h" x="711" y="40">audit.jsonl</text>

  <line class="lane" x1="105" y1="54" x2="105" y2="670"/>
  <line class="lane" x1="330" y1="54" x2="330" y2="670"/>
  <line class="lane" x1="570" y1="54" x2="570" y2="670"/>
  <line class="lane" x1="782" y1="54" x2="782" y2="670"/>

  <!-- plan -->
  <rect class="act" x="30" y="66" width="150" height="34"/>
  <text class="t" x="42" y="87">alertctl plan</text>
  <path class="flow" d="M180,83 L326,83"/>

  <rect class="act" x="215" y="66" width="230" height="34"/>
  <text class="t" x="227" y="87">observe host (read-only)</text>
  <path class="flow" d="M445,83 L566,83"/>
  <path class="flow" d="M566,100 L445,116"/>

  <rect class="act" x="215" y="106" width="230" height="42"/>
  <text class="t" x="227" y="124">diff → plan.json</text>
  <text class="t-s" x="227" y="139">fingerprinted by content</text>

  <path class="flow" d="M215,130 L184,130"/>
  <rect class="act" x="30" y="112" width="150" height="34"/>
  <text class="t" x="42" y="133">review + approve</text>

  <path class="flow" d="M105,146 L105,168 L326,168"/>
  <rect class="act" x="215" y="154" width="230" height="30"/>
  <text class="t" x="227" y="174">alertctl apply -plan …</text>

  <!-- gates -->
  <rect class="gate" x="215" y="196" width="230" height="38"/>
  <text class="t" x="227" y="214">Gate 1 · specs validate</text>
  <text class="t-s" x="227" y="228">same tools/validate.py as CI</text>

  <rect class="gate" x="215" y="242" width="230" height="38"/>
  <text class="t" x="227" y="260">Gate 2 · plan is fresh</text>
  <text class="t-s" x="227" y="274">re-plan; fingerprints must match</text>

  <rect class="gate" x="215" y="288" width="230" height="38"/>
  <text class="t" x="227" y="306">Gate 3 · tags exist</text>
  <text class="t-s" x="227" y="320">semver only — no branches</text>

  <path class="flow" d="M330,184 L330,194"/>
  <path class="flow" d="M330,234 L330,240"/>
  <path class="flow" d="M330,280 L330,286"/>
  <path class="flow" d="M330,326 L330,344"/>

  <!-- deploy -->
  <rect class="act" x="215" y="346" width="230" height="52"/>
  <text class="t" x="227" y="365">deploy one service</text>
  <text class="t-s" x="227" y="380">standard tier before critical</text>
  <text class="t-s" x="227" y="393">max_concurrent_deploys = 1</text>

  <path class="flow" d="M445,372 L566,372"/>
  <rect class="act" x="480" y="346" width="180" height="76"/>
  <text class="t-s" x="492" y="364">clone at pinned tag</text>
  <text class="t-s" x="492" y="378">write env 0640 (secrets)</text>
  <text class="t-s" x="492" y="392">write unit · flip symlink</text>
  <text class="t-s" x="492" y="406">daemon-reload · restart</text>

  <!-- post-deploy gate -->
  <rect class="gate" x="215" y="424" width="230" height="52"/>
  <text class="t" x="227" y="443">Gate 4 · post-deploy health</text>
  <text class="t-s" x="227" y="457">unit active AND /healthz fresh</text>
  <text class="t-s" x="227" y="470">catches start-then-wedge</text>
  <path class="flow" d="M330,398 L330,422"/>
  <path class="flow" d="M445,450 L566,440"/>
  <path class="flow" d="M566,462 L445,468"/>

  <!-- outcomes -->
  <rect class="good" x="215" y="500" width="230" height="42"/>
  <text class="t" x="227" y="519">healthy → next service</text>
  <text class="t-s" x="227" y="533">write deployed.json manifest</text>
  <path class="flow" d="M330,476 L330,498"/>

  <rect class="warn" x="215" y="562" width="230" height="76"/>
  <text class="t" x="227" y="581">any gate fails</text>
  <text class="t-s" x="227" y="596">re-apply the previous ref</text>
  <text class="t-s" x="227" y="610">stop the run — later services</text>
  <text class="t-s" x="227" y="623">are never touched</text>
  <path class="fail" d="M215,450 L196,450 L196,600 L211,600"/>
  <text class="t-s" fill="#cf5147" x="158" y="524">on failure</text>

  <path class="fail" d="M445,600 L566,600"/>
  <rect class="warn" x="480" y="576" width="180" height="46"/>
  <text class="t-s" x="492" y="595">previous release restored</text>
  <text class="t-s" x="492" y="609">from releases/ on disk</text>

  <!-- audit -->
  <path class="audit" d="M445,352 L468,336 L690,336"/>
  <path class="audit" d="M445,514 L690,500"/>
  <path class="audit" d="M445,572 L468,556 L690,556"/>
  <rect x="695" y="320" width="175" height="44" fill="#fff6e6" stroke="#e0a13c" stroke-width="1.2" rx="4"/>
  <text class="t-s" x="707" y="338">apply · started</text>
  <text class="t-s" x="707" y="354">actor · plan id · refs</text>
  <rect x="695" y="480" width="175" height="40" fill="#fff6e6" stroke="#e0a13c" stroke-width="1.2" rx="4"/>
  <text class="t-s" x="707" y="498">apply · success</text>
  <text class="t-s" x="707" y="513">duration · hashes</text>
  <rect x="695" y="550" width="175" height="56" fill="#fff6e6" stroke="#e0a13c" stroke-width="1.2" rx="4"/>
  <text class="t-s" x="707" y="568">apply · failed</text>
  <text class="t-s" x="707" y="583">rollback · success</text>
  <text class="t-s" x="707" y="598">automatic: true</text>

  <text class="t-s" x="30" y="666">Gates 1–3 run before anything on the host is touched. Gate 4 is the one that</text>
  <text class="t-s" x="30" y="681">distinguishes "the process started" from "the service is actually working".</text>
</svg>
